name: La Cite economy (targeted)
on:
  pull_request:
    paths: ['src/cite/**', 'src/server/cite-*.mjs', 'src/domain/exact.ts', 'src/domain/calendar.ts', 'tests/cite/**', 'scripts/simulate-cite-*.mjs', 'prototypes/la-cite/**', 'playwright.cite.config.mjs', 'tests/cite-browser/**', 'scripts/serve-cite-prototype.mjs', '.github/workflows/cite-economy.yml']
  push:
    branches: ['work/la-cite-*']
    paths: ['src/cite/**', 'src/server/cite-*.mjs', 'tests/cite/**', 'scripts/simulate-cite-*.mjs', 'prototypes/la-cite/**', 'playwright.cite.config.mjs', 'tests/cite-browser/**', 'scripts/serve-cite-prototype.mjs', '.github/workflows/cite-economy.yml']
permissions:
  contents: read
jobs:
  economy:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --test tests/cite/*.test.mjs

  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --only-shell chromium
      - run: npx playwright test --config playwright.cite.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cite-prototype-evidence
          path: test-results/cite/
          retention-days: 14
