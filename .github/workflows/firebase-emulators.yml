name: Firebase isolated integration
on:
  pull_request:
    paths: ['src/server/access.mjs', 'src/server/firebase-emulator.mjs', 'src/server/demo-service.mjs', 'src/application/**', 'src/domain/**', 'firebase/**', 'tests/firebase/**', 'package*.json', '.github/workflows/firebase-emulators.yml']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.34.1
      - run: npm run test:firebase
