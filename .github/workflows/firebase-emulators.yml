name: Firebase isolated integration
on:
  pull_request:
    paths: ['src/server/access.mjs', 'src/server/invitations.mjs', 'src/server/team-vote.mjs', 'src/server/gift-preferences.mjs', 'src/server/weekly-questionnaire.mjs', 'src/server/week-coordination.mjs', 'src/server/scoring-policy.mjs', 'src/server/coordination-access.mjs', 'src/server/firebase-emulator.mjs', 'src/server/firebase-http.mjs', 'src/server/http.mjs', 'scripts/serve-firebase.mjs', 'src/web/**', 'web/**', 'tests/firebase-browser/**', 'playwright.firebase.config.mjs', 'src/server/demo-service.mjs', 'src/application/**', 'src/domain/**', 'firebase/**', 'tests/firebase/**', 'package*.json', '.github/workflows/firebase-emulators.yml']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.34.1
      - run: npm run build:web
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --only-shell chromium
      - run: npm run test:firebase:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firebase-login-evidence
          path: test-results/
          retention-days: 14
