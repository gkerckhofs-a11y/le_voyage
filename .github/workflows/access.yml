name: Server access boundary
on:
  pull_request:
    paths: ['src/server/access.mjs', 'tests/access/**', '.github/workflows/access.yml']
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/access/*.test.mjs
