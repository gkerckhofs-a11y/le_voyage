name: Server access boundary
on:
  pull_request:
    paths: ['src/server/provisioned-login.mjs', 'src/server/access.mjs', 'src/server/google-test-gate.mjs', 'src/server/test-access/**', 'scripts/serve-staging.mjs', 'src/server/staging-config.mjs', 'src/server/test-environment.mjs', 'tests/access/**', '.github/workflows/access.yml']
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --test tests/access/*.test.mjs
